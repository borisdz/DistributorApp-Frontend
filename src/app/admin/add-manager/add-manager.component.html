<app-navbar></app-navbar>
<div class="container mt-4">
  <h3>Create Manager</h3>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input class="form-control" formControlName="name" />
    </div>
    <div class="mb-3">
      <label class="form-label">Surname</label>
      <input class="form-control" formControlName="surname" />
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email" />
    </div>
    <div class="mb-3">
      <label class="form-label">Mobile</label>
      <input class="form-control" formControlName="mobile" />
    </div>
    <div class="mb-3">
      <label class="form-label">EDB</label>
      <input class="form-control" formControlName="edb" />
    </div>
    <button class="btn btn-primary" [disabled]="form.invalid">
      Create Manager
    </button>
  </form>
</div>
